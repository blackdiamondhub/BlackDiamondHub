version: "3.8"

services:
  djangoapp:
    # One image per site (see sites/ in the README): HUB_IMAGE_TAG=mercerisland for
    # Mercer Island; unset means :latest, the Sun Peaks image.
    image: ghcr.io/blackdiamondlodge/blackdiamondhub/blackdiamondhub:${HUB_IMAGE_TAG:-latest}
    container_name: BlackDiamondHub
    labels:
      # Watchtower updates only labelled containers (WATCHTOWER_LABEL_ENABLE).
      com.centurylinklabs.watchtower.enable: "true"
    # Pass environment variables (secrets) to Django
    environment:
      # Django core (DJANGO_SECRET_KEY is required; DJANGO_DEBUG defaults to off)
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      HOST: ${HOST}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Table owner used only for the startup backup + migrations (optional;
      # falls back to DB_USER). Not visible to the running site.
      DB_MIGRATE_USER: ${DB_MIGRATE_USER:-}
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:-}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Spotify API credentials
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}

      # Wifi app settings (bdh-app-wifi)
      WIFI_NETWORKS_AUTH: ${WIFI_NETWORKS_AUTH}
      WIFI_NETWORKS_PUBLIC: ${WIFI_NETWORKS_PUBLIC}

      WIFI_PASSWORD_FOR_BDL: ${WIFI_PASSWORD_FOR_BDL}
      WIFI_PASSWORD_FOR_BDL_TO_MI: ${WIFI_PASSWORD_FOR_BDL_TO_MI}
      WIFI_PASSWORD_FOR_BDL_GUEST: ${WIFI_PASSWORD_FOR_BDL_GUEST}

      # Home Assistant Settings
      HOMEASSISTANT_URL: ${HOMEASSISTANT_URL}
      HOMEASSISTANT_ACCESS_TOKEN: ${HOMEASSISTANT_ACCESS_TOKEN}

      # Home Assistant Settings 2
      HOMEASSISTANT_URL_2: ${HOMEASSISTANT_URL_2}
      HOMEASSISTANT_ACCESS_TOKEN_2: ${HOMEASSISTANT_ACCESS_TOKEN_2}

      # Owner visits: hub acts as signed in as this non-staff user (blank = off)
      HUB_OWNER_VISIT_USER: ${HUB_OWNER_VISIT_USER:-}

      # Development remote control (/hub/api/remote/); blank = off. Keep unset in production.
      HUB_REMOTE_TOKEN: ${HUB_REMOTE_TOKEN:-}

      # Container apps (broker/). The broker RPC listens on BROKER_PORT bound to
      # BROKER_BIND only: the docker bridge gateway, so app containers reach it
      # and the LAN does not. App UIs are proxied on 9100..9100+APP_PORTS-1.
      BROKER_BIND: ${BROKER_BIND:-172.17.0.1}
      BROKER_PORT: ${BROKER_PORT:-8099}
      APP_PORTS: ${APP_PORTS:-24}
      BDH_BROKER_URL: ${BDH_BROKER_URL:-http://172.17.0.1:8099/_broker}
      # bdh-supervisor (below) runs the container apps; the hub talks to it
      # over this socket. BDH_SUPERVISOR_TOKEN is a shared secret (openssl rand -hex 32).
      BDH_SUPERVISOR_SOCKET: /run/bdh-supervisor/supervisor.sock
      BDH_SUPERVISOR_TOKEN: ${BDH_SUPERVISOR_TOKEN:-}

      # Napoleon fireplaces (Ayla cloud)
      NAPOLEON_EMAIL: ${NAPOLEON_EMAIL:-}
      NAPOLEON_PASSWORD: ${NAPOLEON_PASSWORD:-}
      NAPOLEON_EUROPE: ${NAPOLEON_EUROPE:-}

      # Restaurants app: Google Places API (New) key; blank = no fetching
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}

      # UniFi Protect API (for camera discovery)
      UNIFI_PROTECT_HOST_1: ${UNIFI_PROTECT_HOST_1}
      UNIFI_PROTECT_API_KEY_1: ${UNIFI_PROTECT_API_KEY_1}
      UNIFI_PROTECT_NAME_1: ${UNIFI_PROTECT_NAME_1}
      UNIFI_PROTECT_HOST_2: ${UNIFI_PROTECT_HOST_2}
      UNIFI_PROTECT_API_KEY_2: ${UNIFI_PROTECT_API_KEY_2}
      UNIFI_PROTECT_NAME_2: ${UNIFI_PROTECT_NAME_2}
      # View-only Protect local user (private API: events, recordings)
      BDH_CAMERAS_PROTECT_USERNAME_1: ${BDH_CAMERAS_PROTECT_USERNAME_1:-}
      BDH_CAMERAS_PROTECT_PASSWORD_1: ${BDH_CAMERAS_PROTECT_PASSWORD_1:-}
      BDH_CAMERAS_PROTECT_USERNAME_2: ${BDH_CAMERAS_PROTECT_USERNAME_2:-}
      BDH_CAMERAS_PROTECT_PASSWORD_2: ${BDH_CAMERAS_PROTECT_PASSWORD_2:-}

      # Gemstone Lights (AWS Amplify cloud)
      GEMSTONE_EMAIL: ${GEMSTONE_EMAIL}
      GEMSTONE_PASSWORD: ${GEMSTONE_PASSWORD}

      # bdl_modes AppDaemon app (vacation / preheat / home)
      BDL_MODES_URL: ${BDL_MODES_URL:-}
      BDL_MODES_API_KEY: ${BDL_MODES_API_KEY:-}
      BDL_MODES_PREHEAT: ${BDL_MODES_PREHEAT:-false}

      # bdl_shuttle AppDaemon app (bus reminders on the dining room Sonos)
      BDH_SHUTTLE_REMINDERS_URL: ${BDH_SHUTTLE_REMINDERS_URL:-}
      BDH_SHUTTLE_REMINDERS_API_KEY: ${BDH_SHUTTLE_REMINDERS_API_KEY:-}

    network_mode: host

    volumes:
      # Database backups taken by the entrypoint before migrations run.
      - ./backups:/backups
      # Uploaded files (inventory images, screensaver photos). Without this
      # they live in the container and are lost on every image update.
      - ./media:/app/media
      # bdh-supervisor's API socket.
      - bdh-supervisor-socket:/run/bdh-supervisor
      # Secret store key (secrets.key, made by generate_secrets_key; see the
      # README). The directory, not the file, is mounted: if the file were
      # missing Docker would create a directory in its place.
      - /etc/bdh:/etc/bdh:ro
    
    restart: unless-stopped

  bdh-supervisor:
    # Runs container apps (https://github.com/blackdiamondlodge/bdh-supervisor).
    # The only container with the Docker socket besides watchtower; it creates
    # the bdh-gateway container, bdh-* networks and the bdh-app-* containers and
    # volumes itself (don't add those here or to watchtower). The cameras app's
    # go2rtc runs as one of its companions, not as a service here.
    image: ghcr.io/blackdiamondlodge/bdh-supervisor:latest
    container_name: bdh-supervisor
    labels:
      # Watchtower updates only labelled containers (WATCHTOWER_LABEL_ENABLE).
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped
    # Needed for the BDH-APPS firewall helper and the 10.213/16 routes.
    network_mode: host
    environment:
      BDH_SUPERVISOR_TOKEN: ${BDH_SUPERVISOR_TOKEN}
      # WebRTC address(es) the cameras go2rtc companion advertises to browsers
      # (this host's LAN IP:8555; bootstrap.sh fills it in).
      BDH_GO2RTC_CANDIDATES: ${BDH_GO2RTC_CANDIDATES:-}
      BDH_CATALOG_URL: ${BDH_CATALOG_URL:-https://raw.githubusercontent.com/blackdiamondlodge/bdh-app-catalog/main/catalog.json}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - bdh-supervisor-socket:/run/bdh-supervisor
      - bdh-supervisor-state:/state

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    # Mount the Docker socket so Watchtower can manage containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Label mode: only containers labelled com.centurylinklabs.watchtower.enable=true
    # (the hub and bdh-supervisor above) are updated. App containers
    # (bdh-app-*), their companions (e.g. go2rtc) and bdh-gateway are never touched: apps are
    # pinned by digest in the catalog and upgraded only by the supervisor.
    # If your Docker registry is private, provide credentials:
    environment:
    #   WATCHTOWER_USERNAME: "${REGISTRY_USERNAME}"
    #   WATCHTOWER_PASSWORD: "${REGISTRY_PASSWORD}"
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      # containrrr/watchtower defaults to Docker API 1.25, which Docker 29+ rejects.
      - DOCKER_API_VERSION=1.44
      # Delete the old image after each update, otherwise every build is
      # kept and the disk fills up (homehub hit 100% with 88 images).
      - WATCHTOWER_CLEANUP=true
    # 
    # Keep watchtower running unless it crashes/restarts
    restart: unless-stopped

volumes:
  bdh-supervisor-socket:
  bdh-supervisor-state:
