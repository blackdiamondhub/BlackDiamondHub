# Read at startup by hub/site.py. Brand paths are relative to this folder.

[brand]
name = "Black Diamond Lodge"
subtitle = "Sun Peaks · BC"
monogram = "brand/bdl-monogram.svg"              # dark diamond, for QR codes
monogram_light = "brand/bdl-monogram-light.svg"  # light diamond, for the navbar
og_image = "brand/og-image.png"                # link-preview card (tools/render_og_image.py)

[sections]  # homepage section titles
mountain = "On the mountain"
lodge = "In the lodge"

[store]  # Settings → Apps refuses installs once installed apps' memory limits pass this
memory_budget_mb = 3072
channel = "stable"  # only promoted versions; beta versions are tried on Mercer Island first

# Event sources for bdh_sdk.events (see the README). "ha" topics look like
# ha/state/<entity_id>; nothing is watched until an app subscribes.
[events.sources.ha]
type = "home_assistant"

# Per-app settings, read by each app as BDH_<APP>_<KEY> (the Settings page and
# the environment still win). See each app's README.
[apps.display]  # the screensaver's info strip until it's set on the Settings page
slots_winter = ["snow_report.temp_top", "snow_report.temp_village", "snow_report.snow_48h", "lift_status.runs_open"]
slots_spring = ["snow_report.temp_top", "snow_report.temp_village", "snow_report.base", "snow_report.sun"]
slots_summer = ["snow_report.temp_top", "snow_report.temp_village", "lift_status.lifts_open", "snow_report.sun"]
slots_fall = ["snow_report.temp_top", "snow_report.temp_village", "days_until_lifts", "snow_report.sun"]

[apps.speakers]
runtime = "container"  # bdh-app-speakers under bdh-supervisor (was sonos_control)
allow_lan = true
models = "Amp"  # the in-wall amps; the soundbars are left to the TVs
presets = [
    { id = "dining_deck", label = "Dining + Top Deck", icon = "fa-utensils", rooms = ["Dining Room", "Top Deck"] },
    { id = "whole", label = "Whole Lodge", icon = "fa-house", rooms = "*" },
]

# Where each room sits on the lodge picture: floor = upper / main / lower or
# outside_main / outside_lower. Keys are Sonos room names.
[apps.speakers.rooms]
"Master Bedroom En-suite" = { label = "Master En-suite", floor = "upper", icon = "fa-bath" }
"Dining Room" = { label = "Dining Room", floor = "main", icon = "fa-utensils" }
"Basement Master En-suite" = { label = "Basement En-suite", floor = "lower", icon = "fa-bath" }
"Top Deck" = { label = "Top Deck", floor = "outside_main", icon = "fa-tree" }
"Lower Deck" = { label = "Lower Deck", floor = "outside_lower", icon = "fa-chair" }
"Hot Tub" = { label = "Hot Tub", floor = "outside_lower", icon = "fa-hot-tub-person" }

# Apps run as containers under bdh-supervisor (inventory stays in-process).
# allow_lan = true lets a network = "lan" app have the LAN; without it it's outbound only.
[apps.wifi]
runtime = "container"  # bdh-app-wifi image under bdh-supervisor

[apps.sunpeaks_webcams]
runtime = "container"  # bdh-app-sunpeaks-webcams image under bdh-supervisor

[apps.lift_status]
runtime = "container"  # bdh-app-lift-status image under bdh-supervisor

[apps.snow_report]
runtime = "container"  # bdh-app-snow-report image under bdh-supervisor

[apps.radiant]
runtime = "container"  # bdh-app-radiant image under bdh-supervisor

[apps.device_control]
runtime = "container"  # bdh-app-device-control image under bdh-supervisor

[apps.cameras]
runtime = "container"  # bdh-app-cameras image under bdh-supervisor
allow_lan = true

[apps.vacation_mode]
runtime = "container"  # bdh-app-vacation-mode image under bdh-supervisor
allow_lan = true

[apps.stays]
runtime = "container"  # bdh-app-stays image under bdh-supervisor

[apps.restaurants]
runtime = "container"  # bdh-app-restaurants image under bdh-supervisor

[apps.shuttle]
runtime = "container"  # bdh-app-shuttle image under bdh-supervisor
allow_lan = true

[apps.hub_calendar]
runtime = "container"  # bdh-app-calendar image under bdh-supervisor

[apps.timers]
runtime = "container"  # bdh-app-timers image under bdh-supervisor
