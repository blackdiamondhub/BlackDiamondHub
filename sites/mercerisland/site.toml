# Read at startup by hub/site.py. Brand paths are relative to this folder.
# No monogram set: the hub uses the default BDH monogram from bdh-sdk.

[brand]
name = "Slivinski Hub"
subtitle = "Mercer Island"
og_image = "brand/og-image.png"  # link-preview card (tools/render_og_image.py)

[sections]  # homepage section titles
lodge = "In the home"

[store]  # Settings → Apps
channel = "beta"  # install and auto-update beta versions (X.Y.ZbN) too

# Event sources for bdh_sdk.events (see the README). "ha" topics look like
# ha/state/<entity_id>; nothing is watched until an app subscribes.
[events.sources.ha]
type = "home_assistant"

# Per-app settings, read by each app as BDH_<APP>_<KEY> (the Settings page and
# the environment still win). See each app's README.
[apps.cameras]
runtime = "container"  # bdh-app-cameras image under bdh-supervisor

[apps.hub_calendar]
runtime = "container"  # bdh-app-calendar image under bdh-supervisor

[apps.weather]
runtime = "container"  # bdh-app-weather image under bdh-supervisor

[apps.wifi]
runtime = "container"  # bdh-app-wifi image under bdh-supervisor

[apps.timers]
runtime = "container"  # bdh-app-timers 2.0.0 under bdh-supervisor

[apps.flights]
runtime = "container"  # bdh-app-flights image under bdh-supervisor

[apps.announcements]
runtime = "container"  # bdh-app-announcements 2.0.0 under bdh-supervisor

[apps.hub]
units = "imperial"

[apps.speakers]
runtime = "container"  # bdh-app-speakers 3.0.0 under bdh-supervisor
models = "*"  # every Sonos
presets = [
    { id = "kitchen_deck", label = "Kitchen + Deck", icon = "fa-utensils", rooms = ["Kitchen", "Deck"] },
    { id = "all", label = "Everywhere", icon = "fa-house", rooms = "*" },
]

# No floors: the room picker is a plain grid. Keys are Sonos room names.
[apps.speakers.rooms]
"Family Room" = { icon = "fa-tv" }
"Kitchen" = { icon = "fa-utensils" }
"Deck" = { icon = "fa-tree" }
"Living Room" = { icon = "fa-couch" }
